<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OsirisZk · Earth &amp; Mars rotorcraft simulators</title>
  <style>
    :root{--bg:#0f0b09;--panel:#17110ecc;--panel2:#1f1713;--line:#3a2a22;--text:#f2e8de;--muted:#b9a493;--accent:#ff8a4c;--accent2:#7ef0ff;--ok:#7bd88f;--bad:#ff6b6b;--grid:#3a2a2280}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
    canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
    header{position:fixed;left:0;right:0;top:0;height:42px;display:flex;align-items:center;gap:14px;padding:0 14px;background:linear-gradient(#0f0b09ee,#0f0b0900);z-index:3}
    header h1{font-size:15px;margin:0;letter-spacing:.3px;white-space:nowrap}header small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header h1 span{color:var(--accent)}header h1 .t2{font-weight:inherit}header small{color:var(--muted)}
    header .sp{flex:1}header select,header button{width:auto;font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
    #side{position:fixed;left:10px;top:48px;bottom:10px;width:380px;max-width:calc(100vw - 20px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);z-index:2}
    #tabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
    #tabs button{flex:1 1 auto;font:inherit;font-size:12px;background:none;color:var(--muted);border:0;border-radius:6px;padding:5px 6px;cursor:pointer}
    #tabs button.on{background:var(--panel2);color:var(--text)}
    #panes{flex:1;min-height:0;overflow:auto}.pane{display:none;padding:10px 12px}.pane.on{display:block}
    .row{display:grid;grid-template-columns:1fr 1.1fr;gap:6px;align-items:center;margin:5px 0}
    label{color:var(--muted)}select,input,button{font:inherit}
    select,input[type=number],input[type=datetime-local]{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
    input[type=range]{width:100%}
    button.act{background:var(--accent);color:#1a0f08;border:0;border-radius:7px;padding:7px 12px;font-weight:600;cursor:pointer}
    button.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}
    button:disabled{opacity:.45;cursor:not-allowed}
    h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin:14px 0 6px}
    table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    .badge{display:inline-block;padding:0 5px;border-radius:4px;font-size:11px;background:#33251d;color:var(--muted)}
    .badge.sourced{background:#173225;color:var(--ok)}.badge.assumed{background:#3a2516;color:#ffb36b}.badge.brief{background:#1b2a3a;color:#8ec5ff}.badge.scenario{background:#35203a;color:#e2a6ff}
    .kv{display:grid;grid-template-columns:1fr auto;gap:2px 8px}.kv b{text-align:right;font-variant-numeric:tabular-nums}
    .warn{color:#ffb38a}.ok{color:var(--ok)}.bad{color:var(--bad)}.note{color:var(--muted);font-size:12px}
    canvas.chart{width:100%;height:150px;display:block;margin:6px 0;background:#0f0b0966;border-radius:6px}
    canvas#map{width:100%;aspect-ratio:1;display:block;border-radius:8px;cursor:crosshair;background:#2a1a12}
    #hud{position:fixed;right:10px;bottom:10px;min-width:240px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font:12px/1.55 ui-monospace,Consolas,monospace;z-index:2;white-space:pre}
    #perf{position:fixed;right:10px;top:48px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font:11px/1.5 ui-monospace,Consolas,monospace;z-index:2;white-space:pre}
    #banner{position:fixed;left:50%;top:48px;transform:translateX(-50%);padding:4px 10px;border-radius:6px;background:#3a2516cc;color:#ffcf9e;font-size:12px;z-index:2;pointer-events:none}
    #report h2,#report h3{color:var(--accent)}#report a{color:var(--accent2)}
    header a.home{color:inherit;text-decoration:none}
    #worlds{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
    #worlds a{padding:3px 10px;color:var(--muted);text-decoration:none;background:var(--panel2)}#worlds a.on{background:var(--accent);color:#0d0a08;font-weight:600}
    .btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
    #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:6px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);z-index:4;opacity:0;transition:opacity .25s;pointer-events:none}
    #toast.on{opacity:1}
    /* Earth world: cooler interface colours */
    body[data-world=earth]{--bg:#0a0f14;--panel:#0e161dcc;--panel2:#15212b;--line:#26394a;--text:#e8f0f6;--muted:#9db2c3;--accent:#6cc3ff;--grid:#26394a80}
    body[data-world=earth] header{background:linear-gradient(#0a0f14ee,#0a0f1400)}
    body[data-world=earth] canvas#map{background:#1b261a}
    body[data-world=earth] #banner{background:#16283acc;color:#bfe3ff}
    /* landing */
    #landing{position:fixed;inset:0;overflow:auto;padding:22px 16px 32px;background:radial-gradient(1200px 600px at 20% -10%,#14304a 0%,transparent 60%),radial-gradient(1000px 600px at 90% 0%,#3a1a0e 0%,transparent 60%),#0b0a0c}
    body.landing header,body.landing #side,body.landing #hud,body.landing #perf,body.landing #banner,body.landing canvas#view{display:none}
    body.landing{overflow:auto}
    .land-top{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .land-top h1{font-size:15px;margin:0;font-weight:600;color:var(--muted)}.land-top h1 span{color:var(--text)}
    .land-top select{width:auto;background:#1a1717;color:var(--text);border:1px solid #333;border-radius:6px;padding:3px 8px}
    #landing h2{max-width:1040px;margin:40px auto 6px;font-size:clamp(26px,4vw,40px);letter-spacing:-.5px}
    #landing .sub{max-width:1040px;margin:0 auto 26px;color:var(--muted);font-size:15px}
    .cards{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
    .card{position:relative;display:flex;flex-direction:column;gap:8px;padding:24px 24px 22px;border-radius:16px;color:var(--text);text-decoration:none;border:1px solid #ffffff1a;overflow:hidden;transition:transform .2s,border-color .2s}
    .card:hover,.card:focus-visible{transform:translateY(-3px);border-color:#ffffff55;outline:none}
    .card.earth{background:linear-gradient(160deg,#10314a 0%,#0d1e26 55%,#0b1512 100%)}
    .card.mars{background:linear-gradient(160deg,#4a2010 0%,#2a140c 55%,#140c09 100%)}
    .card .globe{position:relative;width:132px;height:132px;border-radius:50%;overflow:hidden;margin-bottom:2px;box-shadow:0 0 44px #000a,0 0 0 1px #ffffff14}
    .card .globe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;background:#000}
    .card .credit{font-size:11px;color:#ffffff80;margin-bottom:4px}
    .card.earth .globe{background:radial-gradient(ellipse 30% 7% at 48% 5%,#f4f8fb 0 70%,transparent 76%),radial-gradient(ellipse 40% 6% at 60% 30%,#ffffff8c 0 60%,transparent 70%),radial-gradient(ellipse 30% 22% at 38% 42%,#5f8f3e 0 60%,transparent 64%),radial-gradient(ellipse 22% 30% at 64% 66%,#6f8f45 0 60%,transparent 64%),radial-gradient(circle at 35% 35%,#6ab8ff,#1f5fa8 58%,#0b2347)}
    .card.mars .globe{background:radial-gradient(ellipse 26% 8% at 50% 6%,#f6efe6 0 70%,transparent 76%),radial-gradient(ellipse 20% 13% at 30% 58%,#7a3518b0 0 60%,transparent 70%),radial-gradient(ellipse 13% 18% at 66% 44%,#6e3016a0 0 55%,transparent 68%),radial-gradient(circle at 35% 35%,#f0a070,#b4532a 58%,#4d1d0c)}
    .card h3{margin:0;font-size:22px;text-transform:none;letter-spacing:0;color:var(--text)}.card p{margin:0;color:#ffffffc0;font-size:14px;line-height:1.5}
    .card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 6px;font-size:13px}
    .card dt{color:#ffffff90}.card dd{margin:0;font-variant-numeric:tabular-nums}
    .card .go{margin-top:auto;align-self:flex-start;padding:8px 14px;border-radius:8px;font-weight:600;background:#ffffff1a}
    .card.earth .go{background:#6cc3ff;color:#06131d}.card.mars .go{background:#ff8a4c;color:#1a0f08}
    #landing .foot{max-width:1040px;margin:22px auto 0;color:var(--muted);font-size:12px}
    @media (max-width:760px){#side{top:auto;height:52vh;width:auto;right:10px}#hud{bottom:auto;top:48px;min-width:0}#perf{display:none}header small{display:none}header{gap:8px;padding:0 8px}#quality{display:none}header h1 .t2{display:none}header h1{font-size:14px}#banner{top:auto;bottom:calc(52vh + 18px);max-width:90vw;text-align:center}}
  </style>
</head>
<body>
  <canvas id="view" tabindex="0"></canvas>
  <header><a class="home" id="home" href="./"><h1><span>OsirisZk</span><b class="t2"> · <span data-t="title2">Mars Aerial Explorer</span></b></h1></a><small data-t="subtitle"></small><div class="sp"></div>
    <nav id="worlds" aria-label="Simulator"></nav>
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="tr">Türkçe</option></select>
    <select id="quality" aria-label="Render quality"><option value="low">low</option><option value="medium" selected>medium</option><option value="high">high</option><option value="ultra">ultra</option></select>
  </header>
  <div id="banner"></div>
  <aside id="side"><nav id="tabs"></nav><div id="panes"></div></aside>
  <div id="hud"></div><div id="perf"></div><div id="toast" role="status"></div>
  <section id="landing" hidden></section>
  <script type="module" src="./boot.js"></script>
</body>
</html>
